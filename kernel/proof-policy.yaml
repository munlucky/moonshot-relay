schemaVersion: 1
tiers:
  T0: mechanical
  T1: scenario
  T2: semantic
  T3: independent
hardFloors:
  securityBoundary: T3
  dataMigration: T3
  runtimeAuthority: T3
  destructiveSchemaChange: T3
  installer: T3
  publicContract: T2
  schemaChange: T2
requiredChecks:
  T0: [default]
  T1: [unit-test]
  T2: [static-analysis, unit-test]
  T3: [static-analysis, unit-test, security-review]
# Authoritative binding between an obligation name and how it may be satisfied.
# evidenceClass: hard      -> only a Kernel-executed command counts
# evidenceClass: judgment  -> only a structured judgment/review verdict counts
# commandClasses           -> the project command classes allowed to prove it
obligations:
  default:
    evidenceClass: hard
    commandClasses: [unit-test, integration-test, e2e, static-analysis, build, script]
  unit-test:
    evidenceClass: hard
    commandClasses: [unit-test, integration-test]
  integration-test:
    evidenceClass: hard
    commandClasses: [integration-test, e2e]
  static-analysis:
    evidenceClass: hard
    commandClasses: [static-analysis, build]
  build:
    evidenceClass: hard
    commandClasses: [build]
  data-migration-smoke:
    evidenceClass: hard
    commandClasses: [integration-test, e2e, unit-test]
    protected: true
  security-review:
    evidenceClass: judgment
    commandClasses: []
    protected: true
