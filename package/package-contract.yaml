    - source: templates/product-definition/DISCOVERY_MAP.template.md
      purpose: product_definition_discovery_map_artifact_template
    - source: templates/product-definition/DISCOVERY_TICKET.template.md
      purpose: product_definition_discovery_ticket_artifact_template
    - source: templates/product-definition/RESEARCH_NOTE.template.md
      purpose: linked_research_evidence_note_template
    - source: templates/product-definition/PROTOTYPE_DECISION.template.md
      purpose: linked_prototype_decision_evidence_template
    - source: docs/public/**
      purpose: public_documentation
    - source: tests/package-layout.test.mjs
      purpose: package_layout_materialization_guard
    - source: scripts/install-account-root-harness.mjs
      purpose: account_root_direct_profile_installer
    - source: package.json
      purpose: runtime_dependency_manifest
    - source: package-lock.json
