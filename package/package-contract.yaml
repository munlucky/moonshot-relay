    - source: tools/evals/fixtures/harness-control-plane/golden-regression.json
      purpose: packaged_harness_control_plane_golden_eval_fixture
    - source: tools/evals/fixtures/harness-search-fixtures/fixture-manifest.json
      purpose: packaged_harness_search_fixture_manifest
    - source: tools/harness-lab/harness-lab.mjs
      purpose: external_bootstrap_lab_for_harness_change_gates
    - source: tools/harness-lab/harness-loop.mjs
      purpose: harness_lifecycle_loop_and_h0_closeout_cli
    - source: tools/harness-lab/harness-history.mjs
      purpose: read_only_harness_history_and_frontier_cli
    - source: tools/retro/retro-cli.mjs
      purpose: advisory_retro_collect_import_daily_propose_issue_draft_cli
    - source: tools/awtl/trace-to-testcase.mjs
      purpose: awtl_trace_to_testcase_candidate_generation
    - source: docs/public/guidelines/harness-bootstrap-lab.md
