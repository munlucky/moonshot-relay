      purpose: skill_catalog_authority_and_router_metadata
    - source: package/runtime-surface.json
      purpose: runtime_skill_surface_manifest
    - source: skills/**
      purpose: skill_definitions
    - source: agents/**
      purpose: agent_definitions
    - source: rules/**
      purpose: workflow_policy
    - source: bin/**
      purpose: runtime_entrypoints
    - source: tools/**
      purpose: runtime_tooling
    - source: schemas/**
      purpose: machine_readable_contracts
    - source: schemas/discovery-map.schema.json
      purpose: discovery_map_planning_evidence_contract_no_execution_authority
    - source: schemas/spec-test-obligation.schema.json
      purpose: plan_item_test_obligation_validator_result_contract
    - source: schemas/browser-completion-result.schema.json
      purpose: browser_completion_evidence_only_result_contract
    - source: schemas/context-pack.schema.json
