schemaVersion: 1
contractId: repository-physical-structure-refactor-phase-02
description: "Canonical source and package payload contract for Claude, Codex, Qwen, and Antigravity runtime profiles."

canonicalSource:
  catalog: catalog/
  skills: skills/
  agents: agents/
  rules: rules/
  scripts: scripts/ # maintained support source; workflow scripts are not broadly installed
  bin: bin/
  tools: tools/
  schemas: schemas/
  templates: templates/
  tests: tests/
  publicDocs: docs/public/
  verificationContracts: schemas/

runtimeProfiles:
  moonshotRelay:
    generatedProfileRoot: package/moonshot-relay/profile/
    localRuntimeRoot: ${MOONSHOT_RELAY_HOME:-~/.moonshot-relay}/
    materializer: package/build-package.mjs
    materialization: account_root_common_payload
    generatedCopyPolicy: ignored_generated_package_payload
  claude:
    templateRoot: package/profile-templates/claude/.claude/
    generatedProfileRoot: package/claude/profile/.claude/
    localRuntimeRoot: .claude/
    pluginOutputRoot: .claude-plugin/
    materializer: package/build-package.mjs
    materialization: local_copy_not_committed
    symlinkPolicy: avoid_required_symlinks
  codex:
    templateRoot: package/profile-templates/codex/.codex/
    generatedProfileRoot: package/codex/profile/.codex/
    localRuntimeRoot: .codex/
    pluginOutputRoot: .codex-plugin/
    materializer: package/build-package.mjs
    materialization: local_copy_not_committed
    symlinkPolicy: avoid_required_symlinks
  qwen:
    templateRoot: package/profile-templates/qwen/.qwen/
    generatedProfileRoot: package/qwen/profile/.qwen/
    localRuntimeRoot: .qwen/
    materializer: package/build-package.mjs
    materialization: local_copy_not_committed
    symlinkPolicy: avoid_required_symlinks
  antigravity:
    templateRoot: package/profile-templates/antigravity/.gemini/antigravity/
    generatedProfileRoot: package/antigravity/profile/.gemini/antigravity/
    localRuntimeRoot: .gemini/antigravity/
    skillRuntimeRoot: .gemini/config/
    materializer: package/build-package.mjs
    materialization: local_copy_not_committed
    symlinkPolicy: avoid_required_symlinks

accountRootInstall:
  installer: scripts/install-account-root-harness.mjs
  defaultShellInstaller: install-claude.sh
  mode: account-root-direct
  projectCompatibilityMode: "install-claude.sh --project"
  sharedRuntimeHome:
    env: MOONSHOT_RELAY_HOME
    windowsCmd: "%MOONSHOT_RELAY_HOME%"
    windowsPowerShell: "$env:MOONSHOT_RELAY_HOME"
    posixShell: "${MOONSHOT_RELAY_HOME}"
    default: "~/.moonshot-relay"
  targets:
    common: "${MOONSHOT_RELAY_HOME:-~/.moonshot-relay}"
    claude: "${CLAUDE_HOME:-~/.claude}"
    codex: "${CODEX_HOME:-~/.codex}"
    qwen: "${QWEN_HOME:-~/.qwen}"
    ade: "${ADE_HOME}"
    antigravity: "${ANTIGRAVITY_HOME:-~/.gemini/antigravity}"
    antigravitySkills: "${ANTIGRAVITY_SKILLS_HOME:-~/.gemini/config}"
  commonPayloadEntries:
    - catalog/
    - bin/
    - docs/public/
    - rules/
    - schemas/
    - scripts/
    - skills/
    - templates/
    - tools/
    - runtime/
    - package/
    - package.json
    - package-lock.json
    - verification.contract.yaml
  runtimeExposureEntries:
    claude:
      - CLAUDE.md
      - PROJECT.md
      - README.md
      - agents/
      - profile-contract.yaml
      - rules/
      - skills/
      - verification.contract.yaml
    codex:
      - AGENTS.md
      - README.md
      - agents/
      - rules/
      - skills/
      - verification.contract.yaml
    qwen:
      - QWEN.md
      - README.md
      - agents/
      - rules/
      - skills/
      - verification.contract.yaml
    antigravity:
      - GEMINI.md
      - PROJECT.md
      - README.md
      - agents/
      - profile-contract.yaml
      - rules/
      - skills/
      - verification.contract.yaml
  manifestName: .moonshot-relay-install-manifest.json
  antigravitySkillsManifestName: .moonshot-relay-antigravity-skills-manifest.json
  legacyManifestNames:
    - .claude-settings-install-manifest.json
  legacyHarnessCorePolicy: remove_when_requested_after_backup
  protectedRuntimeEntries:
    claude:
      - settings.json
      - memory.json
      - sessions/
      - cache/
      - plugins/
      - projects/
      - telemetry/
    codex:
      - auth.json
      - config.toml
      - sessions/
      - cache/
      - plugins/
      - memories/
      - sqlite/
    qwen:
      - .env
      - settings.json
      - auth.json
      - credentials.json
      - memory.json
      - tmp/
      - cache/
      - logs/
      - plugins/
  statePolicy: "Account-root profile installation must not write project knowledge, execution evidence, phase status, runtime logs, or verification verdict state."
  runtimeDependencyDelivery:
    nodeSqlite:
      package: "node:sqlite"
      versionSource: package.json
      packagedMetadata:
        - package.json
        - package-lock.json
      degradationStatus: typed_degraded_authority_blocked
  rolloutSmokeLevels:
    - source-smoke
    - package-smoke
    - temp-home-smoke
    - live-account-root-smoke
  liveMutationPolicy: "Live account-root adoption requires explicit approval, state preservation evidence, and rollback evidence."
  preservedStateRoots:
    - "${MOONSHOT_RELAY_HOME:-~/.moonshot-relay}/state/**"
    - "${CLAUDE_HOME:-~/.claude}/sessions/**"
    - "${CLAUDE_HOME:-~/.claude}/memory.json"
    - "${CODEX_HOME:-~/.codex}/sessions/**"
    - "${CODEX_HOME:-~/.codex}/auth.json"
    - "${CODEX_HOME:-~/.codex}/sqlite/**"
    - "${QWEN_HOME:-~/.qwen}/settings.json"
    - "${QWEN_HOME:-~/.qwen}/.env"
    - "${QWEN_HOME:-~/.qwen}/tmp/**"
    - "${QWEN_HOME:-~/.qwen}/logs/**"
    - "${ADE_HOME}/settings.json"
    - "${ADE_HOME}/.env"
    - "${ADE_HOME}/tmp/**"
    - "${ADE_HOME}/logs/**"

kernelCodexAccountRoot:
  installer: "bin/moon-relay-kernel.mjs profile-install --runtime codex --account-root"
  mode: account-root-direct
  target: "${CODEX_HOME:-~/.codex}"
  commandSkillset: kernel-default
  ordinaryTaskPolicy: "do-not-force-unselected-tasks-into-kernel"
  switcher: forbidden
  manifest: .moon-relay-kernel-profile-manifest.json
  removedRelaySkills: "known-workflow-skills-moved-to-recoverable-backup"
  protectedStatePolicy: "preserve-auth-sessions-sqlite-logs-cache-plugins-memories-and-existing-backups"

skillExposure:
  manifest: package/runtime-surface.json
  commonPayloadSkillPolicy: preserve_all_canonical_skills
  serviceProfileSkillPolicy: allowlist_only
  managedSkillPrunePolicy: prune_previously_managed_profile_skills_absent_from_current_payload_preserve_external
  publicRuntimeSkills:
    - product-orchestrator
    - moonshot-architecture
    - moonshot-orchestrator
    - moonshot-phase-runner
    - moonshot-plan-writer
    - commit-moonshot
    - session-logger
    - explain-diff-html
  internalSkillPolicy: "Internal and optional skills remain canonical source under skills/ and are preserved in the shared Moonshot Relay common payload, but Claude/Codex/Qwen runtime profile discovery must not materialize them under profile-local skills/."
  bootstrapSkillPolicy: "moonshot-relay-setup may be installed by Agent Skills CLI from repository source, but it is not part of the Claude/Codex/Qwen account-root or Antigravity global public discovery surface."

