name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI / Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 20.x
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run active tests
        run: npm test

      - name: Check typed source and generated contracts
        run: npm run typecheck && npm run check:boundaries && npm run build:tests:check

      - name: Run Kernel regressions
        run: npm run test:kernel

      - name: Run package tests
        run: npm run test:package

      - name: Run golden eval tests
        run: npm run test:eval

      - name: Package dry-run
        run: node package/build-package.mjs --runtime all --dry-run --json

      - name: Account-root installer dry-run with temp homes
        shell: pwsh
        run: |
          $root = Join-Path ([System.IO.Path]::GetTempPath()) ("moonshot-relay-ci-" + [System.Guid]::NewGuid().ToString("N"))
          $moonshotHome = Join-Path $root "moonshot-home"
          $claudeHome = Join-Path $root "claude-home"
          $codexHome = Join-Path $root "codex-home"
          $qwenHome = Join-Path $root "qwen-home"
          $antigravityHome = Join-Path $root "antigravity-home"
          $json = node scripts/install-account-root-harness.mjs --runtime all --dry-run --json --moonshot-home $moonshotHome --claude-home $claudeHome --codex-home $codexHome --qwen-home $qwenHome --antigravity-home $antigravityHome
          $payload = $json | ConvertFrom-Json
          if ($payload.dryRun -ne $true) { throw "installer did not report dryRun=true" }
          if (($payload.manifests | ForEach-Object { $_.removedCount } | Measure-Object -Sum).Sum -ne 0) { throw "dry-run planned removals" }
          if (($payload.manifests | ForEach-Object { $_.backupCount } | Measure-Object -Sum).Sum -ne 0) { throw "dry-run planned backups" }

      - name: Diff whitespace check
        run: git diff --check
