inventoryRules:
  - candidateStatus is provisional until archaeology and proof binding produce an asset.yaml.
  - CORE requires current integration plus executable proof; source presence alone is insufficient.
  - HOST denotes host, provider, account-root, or installation dependence and needs local evidence.
  - Archive and public-doc paths preserve provenance but do not establish current integration.
  - Every future manifest must bind origin, implementation, contracts, authority, proof, failures, and reintroduction conditions.
  - No entry authorizes deletion, migration, runtime loading, installer inclusion, or feature reintroduction.

